name: Security scan

# RA-5 (Vulnerability Monitoring & Scanning), SI-2 (Flaw Remediation),
# SA-11 (Developer Testing & Evaluation), CA-7 (Continuous Monitoring).
# Runs static analysis, dependency scanning, and container image scanning
# on every push/PR to main; a failing scan blocks the merge. See
# CI_CD_SECURITY.md and CONTAINER_SECURITY.md for the control rationale
# and the reasoning behind the suppressions below.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  code-and-deps:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          # Matches the container's interpreter (Dockerfile, stage e) now
          # that requirements.txt carries fully-patched click/python-dotenv
          # pins that require Python >=3.10. (The one machine still on
          # Python 3.9 in this project's history was the local dev Mac,
          # not CI -- see CONTAINER_SECURITY.md.)
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Static analysis (bandit)
        run: bandit -r . --exclude ./venv,./.git

      - name: Dependency scan (pip-audit)
        run: pip-audit -r requirements.txt

  container-image:
    runs-on: ubuntu-latest
    needs: code-and-deps
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build -t lm-rmf-helpdesk:ci .

      - name: Scan image (Trivy)
        uses: aquasecurity/trivy-action@0.24.0
        with:
          image-ref: lm-rmf-helpdesk:ci
          severity: HIGH,CRITICAL
          exit-code: "1"
          ignore-unfixed: true
          # ignore-unfixed skips findings with Status affected/fix_deferred/
          # will_not_fix (no actionable upstream patch exists yet) and fails
          # the build only on HIGH/CRITICAL findings that DO have a fix
          # available but aren't applied. See CONTAINER_SECURITY.md for the
          # full baseline (24 unfixed findings tracked, 40 closed via the
          # apt-get upgrade layer in the Dockerfile) and the reasoning for
          # this gate design.
