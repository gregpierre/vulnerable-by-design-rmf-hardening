{% extends "base.html" %}
{% block title %}register{% endblock %}
{% block content %}
  <div class="auth">
    <h2>create an account</h2>
    <p class="sub">pick a username and password to get started.</p>
    {% if error %}<div class="error">{{ error }}</div>{% endif %}
    <form method="post">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <input name="username" placeholder="username" autocomplete="username" autofocus required>
      <input name="password" type="password" placeholder="password" autocomplete="new-password" required>
      <button type="submit">register</button>
    </form>
    <p class="foot">already have one? <a href="{{ url_for('login') }}">log in</a></p>
  </div>
{% endblock %}
