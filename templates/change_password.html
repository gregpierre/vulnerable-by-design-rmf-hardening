{% extends "base.html" %}
{% block title %}change password{% endblock %}
{% block content %}
  <div class="auth">
    <h2>change your password</h2>
    <p class="sub">pick something at least 8 characters long.</p>
    {% if error %}<div class="error">{{ error }}</div>{% endif %}
    <form method="post">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <input name="current_password" type="password" placeholder="current password" autocomplete="current-password" autofocus required>
      <input name="new_password" type="password" placeholder="new password" autocomplete="new-password" required>
      <input name="confirm_password" type="password" placeholder="confirm new password" autocomplete="new-password" required>
      <button type="submit">change password</button>
    </form>
  </div>
{% endblock %}
