<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}helpdesk{% endblock %}</title>
  <style>
    :root {
      --bg: #fbfbfc;
      --surface: #ffffff;
      --text: #16181d;
      --muted: #71757e;
      --border: #e7e8ec;
      --accent: #3b5bfd;
      --accent-soft: rgba(59, 91, 253, 0.09);
      --danger: #d6392f;
      --danger-soft: rgba(214, 57, 47, 0.08);
      --radius: 12px;
      --ease: cubic-bezier(0.4, 0, 0.2, 1);
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0e0f12;
        --surface: #16181d;
        --text: #eceef2;
        --muted: #8d919b;
        --border: #262930;
        --accent: #7d94ff;
        --accent-soft: rgba(125, 148, 255, 0.13);
        --danger: #ff6b60;
        --danger-soft: rgba(255, 107, 96, 0.11);
      }
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      padding: 0 1.25rem 4rem;
      background: var(--bg);
      color: var(--text);
      font-family: ui-sans-serif, -apple-system, "Segoe UI", Inter, system-ui, sans-serif;
      font-size: 15px;
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
    }

    nav {
      display: flex;
      align-items: center;
      gap: 1.5rem;
      max-width: 660px;
      margin: 0 auto;
      padding: 1.5rem 0;
      border-bottom: 1px solid var(--border);
    }

    nav a {
      position: relative;
      color: var(--muted);
      text-decoration: none;
      font-size: 0.875rem;
      transition: color 0.18s var(--ease);
    }

    nav a::after {
      content: "";
      position: absolute;
      left: 0;
      bottom: -3px;
      width: 100%;
      height: 1px;
      background: currentColor;
      transform: scaleX(0);
      transform-origin: left;
      transition: transform 0.22s var(--ease);
    }

    nav a:hover { color: var(--text); }
    nav a:hover::after { transform: scaleX(1); }
    nav .spacer { flex: 1; }

    main {
      max-width: 660px;
      margin: 0 auto;
      padding-top: 2.5rem;
      animation: rise 0.4s var(--ease) both;
    }

    @keyframes rise {
      from { opacity: 0; transform: translateY(8px); }
      to   { opacity: 1; transform: none; }
    }

    h1, h2, h3 {
      font-weight: 560;
      letter-spacing: -0.015em;
      margin: 0 0 0.35rem;
    }

    h2 { font-size: 1.4rem; }
    h3 {
      font-size: 0.78rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--muted);
      margin: 2.5rem 0 0.9rem;
    }

    .sub {
      color: var(--muted);
      font-size: 0.9rem;
      margin: 0 0 2rem;
    }

    input, textarea, button {
      font: inherit;
      width: 100%;
      border-radius: 9px;
      transition: border-color 0.18s var(--ease), box-shadow 0.18s var(--ease),
                  background 0.18s var(--ease), transform 0.12s var(--ease);
    }

    input, textarea {
      padding: 0.62rem 0.8rem;
      margin-bottom: 0.6rem;
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--text);
    }

    textarea { min-height: 92px; resize: vertical; }
    input::placeholder, textarea::placeholder { color: var(--muted); }

    input:focus, textarea:focus {
      outline: none;
      border-color: var(--accent);
      box-shadow: 0 0 0 3px var(--accent-soft);
    }

    button {
      padding: 0.62rem 1rem;
      margin-top: 0.3rem;
      background: var(--accent);
      color: #fff;
      border: none;
      font-weight: 500;
      cursor: pointer;
    }

    button:hover { filter: brightness(1.08); }
    button:active { transform: translateY(1px); }

    .search {
      display: flex;
      gap: 0.5rem;
      margin-bottom: 0.5rem;
    }
    .search input { margin-bottom: 0; }
    .search button { margin-top: 0; width: auto; padding-inline: 1.1rem; }

    .card {
      display: block;
      padding: 0.9rem 1rem;
      margin-bottom: 0.6rem;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      text-decoration: none;
      color: inherit;
      animation: rise 0.4s var(--ease) both;
      transition: border-color 0.2s var(--ease), transform 0.2s var(--ease);
    }

    .card:nth-child(1) { animation-delay: 0.03s; }
    .card:nth-child(2) { animation-delay: 0.06s; }
    .card:nth-child(3) { animation-delay: 0.09s; }
    .card:nth-child(4) { animation-delay: 0.12s; }
    .card:nth-child(5) { animation-delay: 0.15s; }
    .card:nth-child(n+6) { animation-delay: 0.18s; }

    a.card:hover {
      border-color: var(--accent);
      transform: translateY(-1px);
    }

    .card .title { font-weight: 540; }
    .card .body {
      color: var(--muted);
      font-size: 0.9rem;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
      margin-top: 0.15rem;
    }

    .meta {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      font-size: 0.8rem;
      color: var(--muted);
      margin-top: 0.4rem;
    }

    .pill {
      padding: 0.08rem 0.5rem;
      border: 1px solid var(--border);
      border-radius: 99px;
      font-size: 0.72rem;
    }

    .error {
      padding: 0.6rem 0.8rem;
      margin-bottom: 1rem;
      background: var(--danger-soft);
      border: 1px solid var(--danger);
      border-radius: 9px;
      color: var(--danger);
      font-size: 0.875rem;
      animation: rise 0.3s var(--ease) both;
    }

    .empty {
      padding: 2rem 0;
      color: var(--muted);
      font-size: 0.9rem;
      text-align: center;
    }

    .auth {
      max-width: 340px;
      margin: 12vh auto 0;
    }

    .foot {
      margin-top: 1.2rem;
      font-size: 0.875rem;
      color: var(--muted);
    }

    .foot a {
      color: var(--accent);
      text-decoration: none;
    }
    .foot a:hover { text-decoration: underline; }

    @media (prefers-reduced-motion: reduce) {
      *, *::after { animation: none !important; transition: none !important; }
    }
  </style>
</head>
<body>
  {% if session.get('username') %}
    <nav>
      <a href="{{ url_for('dashboard') }}">dashboard</a>
      {% if session.get('role') == 'admin' %}
        <a href="{{ url_for('admin_tickets') }}">all tickets</a>
      {% endif %}
      <span class="spacer"></span>
      <a href="{{ url_for('change_password') }}">password</a>
      <a href="{{ url_for('logout') }}">log out</a>
    </nav>
  {% endif %}
  <main>{% block content %}{% endblock %}</main>
</body>
</html>
